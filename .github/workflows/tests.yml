name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install requests biopython numpy
      # the suites stub every Ensembl/UniProt call, so CI needs no network and no TMbed
      - run: python test_structure_compare.py
      - run: python test_resolve_orthologs.py
      - run: python test_abscout.py
