# Publishes the web version to GitHub Pages on every push to main, after the tests pass.
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: web version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install requests biopython numpy
      - run: python test_structure_compare.py
      - run: python test_resolve_orthologs.py
      - run: python test_abtaxa.py
      # copies abtaxa.py, resolve_orthologs.py and structure_compare.py into the site as-is
      - run: python web/build_site.py --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
